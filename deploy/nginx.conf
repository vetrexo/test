# Reverse proxy for app.chakmetdistribution.com -> Next.js on localhost:3000
# Install at /etc/nginx/sites-available/app.chakmetdistribution.com then:
#   sudo ln -s /etc/nginx/sites-available/app.chakmetdistribution.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run `sudo certbot --nginx -d app.chakmetdistribution.com` afterwards — it edits
# this file in place to add the SSL server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name app.chakmetdistribution.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
